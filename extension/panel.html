<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: dark; }
  body { font: 13px/1.5 system-ui, "Segoe UI", sans-serif; margin: 0; padding: 12px;
         background: #15202a; color: #e7e9ea; }
  h3 { margin: 0 0 8px; font-size: 14px; }
  .row { display: flex; gap: 8px; margin: 6px 0; align-items: center; }
  button { background: #1d9bf0; color: #fff; border: 0; border-radius: 18px;
           padding: 7px 16px; font-weight: 600; cursor: pointer; }
  button.stop { background: #f9158b; }
  button.ghost { background: #2f3336; }
  button:disabled { opacity: .5; cursor: default; }
  label { width: 84px; color: #71767b; }
  input[type=number], input[type=text], select { flex: 1; background: #15202a; color: #e7e9ea;
    border: 1px solid #38444d; border-radius: 6px; padding: 4px 8px; }
  .stat { display: inline-block; background: #1e2732; border-radius: 8px;
          padding: 4px 10px; margin: 2px; font-size: 12px; }
  #log { background: #0d141a; border-radius: 8px; padding: 8px; height: 220px;
         overflow-y: auto; font: 11px/1.6 Consolas, monospace; white-space: pre-wrap; }
  #status { font-size: 12px; color: #71767b; }
  .pill { border-radius: 10px; padding: 1px 8px; font-size: 11px; }
  .on { background: #00ba7c33; color: #00ba7c; }
  .off { background: #71767b33; color: #aab8c2; }
  details { margin: 8px 0; }
  summary { cursor: pointer; color: #1d9bf0; }
</style>
</head>
<body>
  <h3>X Auto SOP <span id="status">未连接</span></h3>

  <div class="row">
    <button id="start">开始一轮会话</button>
    <button id="stop" class="stop" disabled>停止</button>
    <button id="rounds" class="ghost">循环：关</button>
    <button id="dash" class="ghost">控制台</button>
  </div>
  <div class="row" id="stats"></div>

  <details open>
    <summary>行为参数（SOP）</summary>
    <div class="row"><label>会话分钟</label><input type="number" id="session_minutes" min="5" max="60"></div>
    <div class="row"><label>打字 ms/字</label><input type="number" id="typing_ms" min="50" max="500"></div>
    <div class="row"><label>点赞概率</label><input type="number" id="like_prob" min="0" max="1" step="0.05"></div>
    <div class="row"><label>评论概率</label><input type="number" id="comment_prob" min="0" max="1" step="0.05"></div>
    <div class="row"><label>评论规则</label>
      <select id="comment_rule">
        <option value="mine">我的规则（短评·13字左右·上限20字）</option>
        <option value="sop">原 SOP 规则（严格校验）</option>
      </select></div>
    <div class="row"><label>评论文数</label><input type="number" id="comment_target_len" min="5" max="20"></div>
    <div class="row"><label>发现页概率</label><input type="number" id="explore_prob" min="0" max="1" step="0.05"></div>
    <div class="row"><label>展开概率</label><input type="number" id="expand_prob" min="0" max="1" step="0.05"></div>
    <div class="row"><label>收藏概率</label><input type="number" id="bookmark_prob" min="0" max="1" step="0.05"></div>
    <div class="row"><label>每轮关注≤</label><input type="number" id="follow_per_session" min="0" max="5"></div>
    <div class="row"><label>语气</label>
      <select id="tone">
        <option value="friendly">随和</option><option value="professional">专业</option>
        <option value="humorous">幽默</option><option value="curious">好奇</option>
        <option value="supportive">共情</option><option value="sharp">直接</option>
      </select></div>
    <div class="row"><label>长度档</label>
      <select id="style">
        <option value="short">短</option><option value="normal">正常</option><option value="detailed">详细</option>
      </select></div>
    <div class="row"><label>处理通知</label><input type="checkbox" id="notif_enabled" style="flex:0"></div>
  </details>

  <details>
    <summary>评论审核</summary>
    <div class="row" style="margin-bottom:4px">
      <label>发送前审核</label>
      <input type="checkbox" id="review_enabled" style="flex:0">
      <span class="hint" id="reviewHint" style="color:#71767b;font-size:10px;flex:1">默认关闭</span>
    </div>
    <div class="row"><label>及格线</label><input type="number" id="review_threshold" min="0" max="100" step="5"></div>
    <div class="row"><button class="ghost" id="openReviewRules" style="padding:3px 8px;font-size:11px">改词表（增删改）</button></div>
  </details>

  <details>
    <summary>LLM 与额度</summary>
    <div class="row"><label>API Key</label><input type="text" id="llm_key" placeholder="留空=模板兜底"></div>
    <div class="row"><label>模型</label><input type="text" id="llm_model"></div>
    <div class="row"><label>日赞上限</label><input type="number" id="max_like" min="0" max="200"></div>
    <div class="row"><label>日评上限</label><input type="number" id="max_reply" min="0" max="100"></div>
    <div class="row"><label>日关注上限</label><input type="number" id="max_follow" min="0" max="50"></div>
  </details>

  <div class="row">
    <button id="save" class="ghost">保存设置</button>
    <button id="export" class="ghost">导出记录</button>
  </div>
  <div id="log"></div>

<script src="panel.js"></script>
</body>
</html>
